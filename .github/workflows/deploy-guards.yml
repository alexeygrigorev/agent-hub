name: deploy-guards
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-guards:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, contabo]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy guard tests
        run: |
          set -euo pipefail
          for script in deploy/vm/*.sh; do bash -n "$script"; done
          bash deploy/vm/test-hub-site-ownership.sh
          bash deploy/vm/test-hub-only-installer.sh
          bash deploy/vm/test-deploy-guard.sh
