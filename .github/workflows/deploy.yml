name: CI / CD Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/resource-management.json"
      - "host/**"
      - "pyproject.toml"
      - "uv.lock"
      - "public/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "config/resource-management.json"
      - "host/**"
      - "pyproject.toml"
      - "uv.lock"
      - "public/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploying (emergency only)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Perform dry-run deploy only (wrangler deploy --dry-run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope boundary (all pushed commits)
        run: python3 scripts/ci/scope_guard.py

      - name: Shared device login (DataTalksClub/auth)
        uses: actions/checkout@v4
        with:
          repository: DataTalksClub/auth
          path: .deps/auth

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate CI/CD workflows and scripts
        run: |
          python3 scripts/ci/validate-workflow.py
          python3 scripts/ci/test_ci.py

      - name: Focused Worker tests (Vitest)
        run: npx vitest run test/repos.test.ts test/mcp.test.ts test/mcp-oauth-compat.test.ts test/human-auth.test.ts test/token-auth.test.ts test/auth-web-repair.test.ts test/proxy-origin.test.ts test/session-control.test.ts test/fleet.test.ts test/role-leases.test.ts test/m4-jobs.test.ts test/intake.test.ts test/intake-scope.test.ts test/intake-phone.test.ts test/host-history.test.ts test/fleet-health-visibility.test.ts test/machine-alias.test.ts test/metrics.test.ts test/monitoring.test.ts test/checks.test.ts test/status.test.ts test/session-lifecycle.test.ts test/session-lifecycle-m15c.test.ts test/human-conversation.test.ts test/conversation-followthrough.test.ts test/conversation-links-r2.test.ts test/machine-id-boundaries.test.ts test/host-authority-r6.test.ts test/session-stall.test.ts test/usage-history.test.ts test/tbm-ingestion.test.ts test/tbm-controller.test.ts test/tbm-e2e.test.ts test/tbm-admission.test.ts test/pacing.test.ts test/tbm-quota-schema.test.ts

      - name: Phone-width browser UI (390x844, light+dark)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test/phone-ui.browser.mjs --out .local/phone-ui
          node test/host-health-charts.browser.mjs
          node test/usage-history.browser.mjs
          node test/tbm-dashboard.browser.mjs
          node test/session-stall.browser.mjs

      - name: Build Hub CLI zipapp
        run: python3 scripts/build-hub-cli.py --out-dir public/cli

      - name: Worker dry-run build verification
        run: npm run build

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"

      - name: Python critical regressions
        env:
          DTC_AUTH_HOME: ${{ github.workspace }}/.deps/auth
          TMPDIR: ${{ github.workspace }}/.local/tmp
        run: |
          mkdir -p .local/tmp
          uv sync --frozen
          uv run --frozen --with pytest python -m pytest -q host/tests/test_repos.py host/tests/test_aplexer_client.py host/tests/test_supervisor_python.py host/tests/test_human_auth.py host/tests/test_cli.py host/tests/test_session_control.py host/tests/test_intake.py host/tests/test_intake_scope.py host/tests/test_disk_monitor.py host/tests/test_token_usage.py host/tests/test_tbm_tokens.py host/tests/test_tbm_banked.py host/tests/test_tbm_cli.py host/tests/test_host_health_monitor.py host/tests/test_status.py host/tests/test_status_probe.py host/tests/test_fleet.py host/tests/test_offered_refusals.py host/tests/test_session_executor.py host/tests/test_guarded_delivery.py host/tests/test_capture_evidence.py host/tests/test_retired_native.py host/tests/test_role_runtime.py host/tests/test_role_dispatch.py host/tests/test_jobs.py host/tests/test_runtime.py host/tests/test_session_control_loop.py host/tests/test_session_real_worker.py host/tests/test_real_worker_startup.py host/tests/test_session_lifecycle_m15c.py test/test_scripts.py test/test_mcp_parity.py test/test_phone_ui.py host/tests/test_role_runtime_repair.py host/tests/test_role_dispatch_recovery.py host/tests/test_session_progress.py host/tests/test_runtime_diagnostics.py host/tests/test_cpu_resources.py host/tests/test_resource_management.py host/tests/test_cpu_dispatch.py host/tests/test_service_health.py host/tests/test_tbm_routed_results.py

  deploy:
    concurrency:
      group: agent-hub-production
      cancel-in-progress: false
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests == true)) &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope boundary (all pushed commits)
        run: python3 scripts/ci/scope_guard.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Hub CLI zipapp & manifest
        run: |
          python3 scripts/build-hub-cli.py --out-dir public/cli
          ls -la public/cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy and verify isolated Hub dev
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PYDEV'
          import json
          from pathlib import Path
          root = Path.cwd()
          config = json.loads((root / 'wrangler.jsonc').read_text())
          config['name'] = 'agent-hub-dev'
          config.pop('routes', None)
          config.pop('route', None)
          config['workers_dev'] = True
          config['durable_objects'] = {'bindings': [{'name': 'HUB', 'class_name': 'Hub'}]}
          config['main'] = str(root / 'src/worker.ts')
          config['assets']['directory'] = str(root / 'public')
          config['triggers'] = {'crons': []}
          Path('.local').mkdir(exist_ok=True)
          Path('.local/dev-wrangler.json').write_text(json.dumps(config))
          PYDEV
          npx wrangler deploy --config .local/dev-wrangler.json --tag "$(git rev-parse --short=12 HEAD)" --message "source_commit=$(git rev-parse HEAD)"
          python3 - <<'PYDEV'
          import json, os, time, urllib.error, urllib.request
          base = 'https://agent-hub-dev.cloudflare-ai-agent-de9ca0.workers.dev'
          def probe(path):
              request = urllib.request.Request(base + path, headers={'User-Agent': 'AgentHub-Release-Smoke/1.0'})
              return urllib.request.urlopen(request, timeout=15)
          for attempt in range(6):
              try:
                  with probe('/livez') as response:
                      assert response.status == 200
                      assert json.load(response) == {'status': 'ok', 'component': 'hub-worker'}
                  with probe('/cli/manifest.json?source=' + os.environ['GITHUB_SHA']) as response:
                      assert json.load(response)['built_from_commit'] == os.environ['GITHUB_SHA']
                  try:
                      probe('/api/sessions')
                  except urllib.error.HTTPError as error:
                      assert error.code in (401, 403), error.code
                  else:
                      raise RuntimeError('dev sessions must require authentication')
                  break
              except (AssertionError, OSError):
                  if attempt == 5:
                      raise
                  time.sleep(5)
          print('Isolated Hub dev liveness and authentication smoke passed')
          PYDEV

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}" = "true" ]; then
            echo "Dry-run deployment requested..."
            npx wrangler deploy --dry-run --outdir dist
          else
            echo "Deploying Worker agent-hub: tag=$SHORT_SHA source_commit=$FULL_SHA"
            npx wrangler deploy --tag "$SHORT_SHA" --message "source_commit=$FULL_SHA"
            echo "Deployment succeeded. Current active versions:"
            npx wrangler versions list
          fi
