name: CI / CD Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "host/**"
      - "pyproject.toml"
      - "uv.lock"
      - "public/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "host/**"
      - "pyproject.toml"
      - "uv.lock"
      - "public/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploying (emergency only)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Perform dry-run deploy only (wrangler deploy --dry-run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Shared device login (DataTalksClub/auth)
        uses: actions/checkout@v4
        with:
          repository: DataTalksClub/auth
          path: .deps/auth

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate CI/CD workflows and scripts
        run: |
          python3 scripts/ci/validate-workflow.py
          python3 scripts/ci/test_ci.py

      - name: Focused Worker tests (Vitest)
        run: npx vitest run test/mcp.test.ts test/human-auth.test.ts test/token-auth.test.ts test/auth-web-repair.test.ts test/proxy-origin.test.ts test/session-control.test.ts test/fleet.test.ts test/role-leases.test.ts test/m4-jobs.test.ts test/intake.test.ts test/intake-scope.test.ts test/intake-phone.test.ts test/host-history.test.ts test/fleet-health-visibility.test.ts test/machine-alias.test.ts test/metrics.test.ts test/monitoring.test.ts test/checks.test.ts test/status.test.ts test/session-lifecycle.test.ts test/session-lifecycle-m15c.test.ts test/human-conversation.test.ts test/conversation-followthrough.test.ts test/conversation-links-r2.test.ts test/machine-id-boundaries.test.ts test/host-authority-r6.test.ts test/session-stall.test.ts

      - name: Phone-width browser UI (390x844, light+dark)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test/phone-ui.browser.mjs --out .local/phone-ui
          node test/host-health-charts.browser.mjs
          node test/session-stall.browser.mjs

      - name: Build Hub CLI zipapp
        run: python3 scripts/build-hub-cli.py --out-dir public/cli

      - name: Worker dry-run build verification
        run: npm run build

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"

      - name: Python critical regressions
        env:
          DTC_AUTH_HOME: ${{ github.workspace }}/.deps/auth
          TMPDIR: ${{ github.workspace }}/.local/tmp
        run: |
          mkdir -p .local/tmp
          uv sync --frozen
          uv run --frozen --with pytest python -m pytest -q host/tests/test_aplexer_client.py host/tests/test_supervisor_python.py host/tests/test_human_auth.py host/tests/test_cli.py host/tests/test_session_control.py host/tests/test_intake.py host/tests/test_intake_scope.py host/tests/test_disk_monitor.py host/tests/test_host_health_monitor.py host/tests/test_status.py host/tests/test_status_probe.py host/tests/test_fleet.py host/tests/test_session_executor.py host/tests/test_guarded_delivery.py host/tests/test_capture_evidence.py host/tests/test_retired_native.py host/tests/test_role_runtime.py host/tests/test_role_dispatch.py host/tests/test_jobs.py host/tests/test_runtime.py host/tests/test_session_control_loop.py host/tests/test_session_real_worker.py host/tests/test_real_worker_startup.py host/tests/test_session_lifecycle_m15c.py test/test_scripts.py test/test_mcp_parity.py test/test_phone_ui.py host/tests/test_role_runtime_repair.py host/tests/test_role_dispatch_recovery.py host/tests/test_session_progress.py

  deploy:
    concurrency:
      group: agent-hub-production
      cancel-in-progress: false
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests == true)) &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Hub CLI zipapp & manifest
        run: |
          python3 scripts/build-hub-cli.py --out-dir public/cli
          ls -la public/cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}" = "true" ]; then
            echo "Dry-run deployment requested..."
            npx wrangler deploy --dry-run --outdir dist
          else
            echo "Deploying Worker agent-hub: tag=$SHORT_SHA source_commit=$FULL_SHA"
            npx wrangler deploy --tag "$SHORT_SHA" --message "source_commit=$FULL_SHA"
            echo "Deployment succeeded. Current active versions:"
            npx wrangler versions list
          fi
