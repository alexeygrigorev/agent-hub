name: Hub 2 production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without changing production
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Session controller shell regression tests
        run: |
          mkdir -p "${RUNNER_TEMP}/ops-watchdog-home"
          HOME="${RUNNER_TEMP}/ops-watchdog-home" bash ops/tests/session-ctl.test.sh
      - name: Ops watchdog Python regression tests
        working-directory: host
        run: python -m unittest discover -s tests -p 'test_ops_watchdog.py'
  hub2:
    uses: ./.github/workflows/hub2.yml
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
      - run: npm ci
      - run: npm test
      - run: python3 scripts/ci/validate-workflow.py
      - run: python3 scripts/ci/test_ci.py
      - run: npm run typecheck
      - run: python3 scripts/ci/test_root_distribution.py
      - run: npm run build
  deploy:
    needs: [hub2, distribution]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.dry_run
    concurrency:
      group: agent-hub-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy validated Hub2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/ci/wrangler_retry.py npx wrangler deploy --config wrangler.jsonc
          python3 scripts/ci/wrangler_retry.py npx wrangler versions list --config wrangler.jsonc
      - name: Verify Hub2 health
        run: |
          python3 - <<'PYTHON'
          import json, urllib.request
          request = urllib.request.Request('https://hub.dtcdev.click/health', headers={'User-Agent': 'agent-hub-ci'})
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          assert payload.get('status') == 'maintenance' or payload.get('service') == 'hub2', payload
          PYTHON
