name: Hub 2 production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without changing production
        type: boolean
        default: true
      release_mode:
        description: Production mode to deploy (bootstrap keeps dispatch disabled)
        type: choice
        options:
          - bootstrap
          - active
        default: bootstrap
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Hub2 VM installer inputs
        run: |
          bash -n deploy/vm/install-hub2-node.sh
          test -s deploy/agent-hub-hub2.service
          test -s deploy/Caddyfile
          test -s deploy/vm/hub2-dns-update.sh
          test -s deploy/vm/agent-hub-dns-update.service
          grep -Fq 'systemctl restart agent-hub-hub2.service' deploy/vm/install-hub2-node.sh
      - name: Session controller shell regression tests
        run: |
          mkdir -p "${RUNNER_TEMP}/ops-watchdog-home"
          HOME="${RUNNER_TEMP}/ops-watchdog-home" bash ops/tests/session-ctl.test.sh
      - name: Ops watchdog Python regression tests
        working-directory: host
        run: python -m unittest discover -s tests -p 'test_ops_watchdog.py'
  hub2:
    uses: ./.github/workflows/hub2.yml
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
      - run: npm ci
      - run: npm test
      - run: python3 scripts/ci/validate-workflow.py
      - run: python3 scripts/ci/test_ci.py
      - run: npm run typecheck
      - run: python3 scripts/ci/test_root_distribution.py
      - run: npm run build
  deploy:
    needs: [hub2, distribution]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.dry_run
    concurrency:
      group: agent-hub-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install VM deploy key
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/hub_vm_key <<< "${{ secrets.AGENT_HUB_VM_DEPLOY_KEY }}"
      - name: Deploy validated revision to the hub VM (SSH only; no cloud credentials)
        env:
          SSH: ssh -i ~/.ssh/hub_vm_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          $SSH 'set -eu
            cd /opt/agent-hub
            git fetch origin main
            git checkout --detach --force origin/main
            export TMPDIR=/opt/agent-hub/.local/tmp
            mkdir -p "$TMPDIR"
            npm ci --omit=dev
            sudo bash deploy/vm/install-hub2-node.sh
            systemctl is-active --quiet agent-hub-hub2.service
            curl -fsS --max-time 10 http://127.0.0.1:8787/health'
      - name: Verify public health through the edge
        run: |
          for attempt in 1 2 3 4 5 6; do
            payload="$(curl -fsS --max-time 15 https://hub.dtcdev.click/health 2>/dev/null || true)"
            case "$payload" in
              *'"status"'*) echo "$payload"; exit 0 ;;
            esac
            sleep 10
          done
          echo "public health check failed" >&2
          exit 1
