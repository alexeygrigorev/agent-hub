name: Hub 2 production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without changing production
        type: boolean
        default: true
      release_mode:
        description: Production mode to deploy (bootstrap keeps dispatch disabled)
        type: choice
        options:
          - active
          - bootstrap
        default: active
      confirm_bootstrap:
        description: Type DISABLE-HUB-DISPATCH to deploy release_mode=bootstrap (disables every intake/session route with 503)
        type: string
        required: false
        default: ''
      rollback_pending:
        description: Restore the protected previous release after an interrupted deploy
        type: boolean
        default: false
      hub_only:
        description: Deploy Hub2 service only without reloading Caddy
        type: boolean
        default: false
      oncall_recipient_public_key_b64:
        description: Optional base64 PEM RSA public key for a one-time, recipient-encrypted oncall token artifact
        type: string
        required: false
        default: ''
      oncall_rotate:
        description: Explicitly rotate the oncall token pair when recovering from a lost encrypted artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Hub2 VM installer inputs
        run: |
          bash -n deploy/vm/install-hub2-node.sh
          test -s deploy/agent-hub-hub2.service
          test -s deploy/hub.caddy
          test -s deploy/vm/hub2-dns-update.sh
          test -s deploy/vm/agent-hub-dns-update.service
          grep -Fq 'systemctl restart agent-hub-hub2.service' deploy/vm/install-hub2-node.sh
          grep -Fq 'reverse_proxy 127.0.0.1:8787' deploy/hub.caddy
          grep -Fq 'shared Caddyfile must import /etc/caddy/sites/*.caddy' deploy/vm/install-hub2-node.sh
          bash -n deploy/vm/deploy-release-transaction.sh deploy/vm/install-hub2-node.sh
          bash deploy/vm/test-deploy-guard.sh
          bash -n deploy/vm/test-hub-only-installer.sh
          bash deploy/vm/test-hub-only-installer.sh
          bash deploy/vm/test-hub-site-ownership.sh
      - name: Session controller shell regression tests
        run: |
          mkdir -p "${RUNNER_TEMP}/ops-watchdog-home"
          HOME="${RUNNER_TEMP}/ops-watchdog-home" bash ops/tests/session-ctl.test.sh
      - name: Ops watchdog Python regression tests
        working-directory: host
        run: python -m unittest discover -s tests -p 'test_ops_watchdog.py'
      - name: Oncall credential envelope tests
        run: python deploy/vm/test_provision_oncall_alerts.py
  hub2:
    uses: ./.github/workflows/hub2.yml
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
      - run: npm ci
      - run: npm test
      - run: python3 scripts/ci/validate-workflow.py
      - run: python3 scripts/ci/test_ci.py
      - run: npm run typecheck
      - run: python3 scripts/ci/test_root_distribution.py
      - run: npm run build
  deploy:
    needs: [test, hub2, distribution]
    # Intake bf07f437: a green push to main deploys automatically (release_mode
    # active, full Caddy), so a merged Hub host/server fix never sits
    # unpublished waiting for someone to dispatch. Pull requests never deploy;
    # workflow_dispatch stays the manual and bootstrap path.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && !inputs.rollback_pending))
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: agent-hub-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require green Python host tests for this main commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid deploy commit" >&2; exit 2; }
          runs_path="$RUNNER_TEMP/python-tests-runs.json"
          for attempt in $(seq 1 60); do
            gh api "repos/$REPO/actions/workflows/python-tests.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=20" > "$runs_path"
            if python3 - "$runs_path" "$DEPLOY_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          runs = [r for r in payload.get("workflow_runs", []) if r.get("head_sha") == sys.argv[2]]
          if any(r.get("status") == "completed" and r.get("conclusion") == "success" for r in runs):
              raise SystemExit(0)
          if runs and all(r.get("status") == "completed" for r in runs):
              print("Python host tests did not pass for this commit: "
                    + ",".join(sorted({str(r.get("conclusion")) for r in runs})), file=sys.stderr)
              raise SystemExit(2)
          raise SystemExit(1)
          PY
            then
              echo "Python host tests are green for $DEPLOY_SHA"
              exit 0
            else
              rc=$?
              ((rc == 1 && attempt < 60)) || { echo "refusing automatic deploy of $DEPLOY_SHA without green Python host tests" >&2; exit 1; }
              sleep 10
            fi
          done
      - name: Prepare and verify matched CLI release bundle
        if: (inputs.release_mode || 'active') == 'active'
        id: prepare_cli_bundle
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid deploy commit" >&2; exit 2; }
          bundle_root="$RUNNER_TEMP/matched-cli-release"
          bundle_dir="$bundle_root/$DEPLOY_SHA"
          archive_path="$bundle_root/hub2-release-$DEPLOY_SHA.zip"
          runs_path="$bundle_root/runs-$DEPLOY_SHA.json"
          artifacts_path="$bundle_root/artifacts-$DEPLOY_SHA.json"
          rm -rf -- "$bundle_root"
          mkdir -m 700 -p "$bundle_root"
          run_id=""
          for attempt in $(seq 1 18); do
            gh api "repos/$REPO/actions/workflows/release-tooling.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=20" > "$runs_path"
            if run_id="$(python3 - "$runs_path" "$DEPLOY_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          sha = sys.argv[2]
          matches = [
              r for r in payload.get("workflow_runs", [])
              if r.get("head_sha") == sha
              and r.get("event") == "push"
              and r.get("head_branch") == "main"
          ]
          completed = [
              r for r in matches
              if r.get("status") == "completed" and r.get("conclusion") == "success"
          ]
          if completed:
              completed.sort(key=lambda r: int(r["id"]))
              print(completed[-1]["id"])
              raise SystemExit(0)
          in_progress = [r for r in matches if r.get("status") != "completed"]
          if in_progress:
              raise SystemExit(1)
          raise SystemExit(2)
          PY
            )"; then
              break
            else
              rc=$?
              if ((rc == 1 && attempt < 18)); then
                sleep 10
                continue
              fi
              echo "no successful main release-tooling push run for $DEPLOY_SHA" >&2
              exit 1
            fi
          done
          test -n "$run_id" || { echo "no release-tooling run id resolved for $DEPLOY_SHA" >&2; exit 1; }
          gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" > "$artifacts_path"
          read -r artifact_id expected_digest < <(python3 - "$artifacts_path" "hub2-release-$DEPLOY_SHA" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          name = sys.argv[2]
          matches = [
              a for a in payload.get("artifacts", [])
              if a.get("name") == name and not a.get("expired")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one active artifact {name}, found {len(matches)}")
          digest = str(matches[0].get("digest") or "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("artifact is missing a sha256 digest")
          print(matches[0]["id"], digest.split(":", 1)[1])
          PY
          )
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "$archive_path"
          actual_digest="$(sha256sum "$archive_path" | awk '{print $1}')"
          [[ "$actual_digest" == "$expected_digest" ]] \
            || { echo "artifact archive digest mismatch for $DEPLOY_SHA" >&2; exit 1; }
          manifest_sha256="$(python3 - "$archive_path" "$bundle_dir" "$DEPLOY_SHA" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          dest = Path(sys.argv[2])
          dest.mkdir(parents=True, mode=0o700)
          seen = set()
          max_bytes = 64 * 1024 * 1024
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if not infos or len(infos) > 32:
                  raise SystemExit("unexpected release archive entry count")
              for info in infos:
                  pure = PurePosixPath(info.filename)
                  if info.is_dir() or pure.is_absolute() or len(pure.parts) != 1:
                      raise SystemExit(f"unsafe archive entry: {info.filename}")
                  name = pure.name
                  if name in {"", ".", ".."} or not re.fullmatch(r"[A-Za-z0-9._+-]+", name):
                      raise SystemExit(f"invalid release filename: {name}")
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode and mode != stat.S_IFREG:
                      raise SystemExit(f"non-regular archive entry: {name}")
                  if name in seen or info.file_size > max_bytes:
                      raise SystemExit(f"duplicate or oversized archive entry: {name}")
                  seen.add(name)
                  data = zf.read(info)
                  if len(data) != info.file_size:
                      raise SystemExit(f"truncated archive entry: {name}")
                  out = dest / name
                  with open(out, "wb") as handle:
                      handle.write(data)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.chmod(out, 0o600)
          manifest_bytes = (dest / "host-release.json").read_bytes()
          manifest = json.loads(manifest_bytes.decode("utf-8"))
          if manifest.get("host_version") != sys.argv[3]:
              raise SystemExit("extracted host-release.json does not match deploy commit")
          print(hashlib.sha256(manifest_bytes).hexdigest())
          PY
          )"
          python3 scripts/build-hub2-release.py \
            --rev "$DEPLOY_SHA" \
            --verify-dir "$bundle_dir" \
            --manifest-sha256 "$manifest_sha256"
          printf 'bundle_dir=%s\nmanifest_sha256=%s\n' "$bundle_dir" "$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Install VM deploy key
        env:
          VM_DEPLOY_KEY: ${{ secrets.AGENT_HUB_VM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/agent-hub-ssh"
          umask 077
          key_file="$RUNNER_TEMP/agent-hub-ssh/hub_vm_key"
          printf '%s\n' "$VM_DEPLOY_KEY" > "$key_file"
          unset VM_DEPLOY_KEY
          if ! ssh-keygen -y -P '' -f "$key_file" >/dev/null 2>&1; then
            echo "VM deploy key is not a valid unencrypted private key" >&2
            exit 1
          fi
      - name: Stage verified matched CLI release bundle on VM
        if: (inputs.release_mode || 'active') == 'active'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BUNDLE_DIR: ${{ steps.prepare_cli_bundle.outputs.bundle_dir }}
          SSH_TARGET: ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid deploy commit" >&2; exit 2; }
          test -d "$BUNDLE_DIR" || { echo "verified CLI bundle directory is missing" >&2; exit 2; }
          test -n "$SSH_TARGET" || { echo "VM SSH target is not configured" >&2; exit 2; }
          tar -C "$BUNDLE_DIR" -cf - . | ssh -i "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_TARGET" \
            "set -euo pipefail; deploy_sha='$DEPLOY_SHA'; [[ \"\$deploy_sha\" =~ ^[0-9a-f]{40}\$ ]]; tmp_root=/opt/agent-hub/.local/tmp; target_dir=\"\$tmp_root/ci-cli-release-\$deploy_sha\"; stage_dir=\"\$tmp_root/ci-cli-release-\$deploy_sha.stage-\$\$\"; mkdir -p \"\$tmp_root\"; chmod 750 \"\$tmp_root\"; rm -rf -- \"\$stage_dir\"; mkdir -m 700 \"\$stage_dir\"; trap 'rm -rf -- \"\$stage_dir\"' EXIT; tar -C \"\$stage_dir\" --no-same-owner --no-same-permissions -xf -; rm -rf -- \"\$target_dir\"; mv -T -- \"\$stage_dir\" \"\$target_dir\"; trap - EXIT"
      - name: Deploy validated revision through the fixed VM transaction script
        id: deploy_vm
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'active' }}
          CONFIRM_BOOTSTRAP: ${{ inputs.confirm_bootstrap }}
          HUB_ONLY: ${{ inputs.hub_only }}
          DEPLOY_SHA: ${{ github.sha }}
          SSH_TARGET: ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          set -euo pipefail
          cli_mode_args=()
          case "$RELEASE_MODE" in
            active) cli_mode_args=(matched-cli) ;;
            bootstrap)
              [[ "$CONFIRM_BOOTSTRAP" == "DISABLE-HUB-DISPATCH" ]] \
                || { echo "release_mode=bootstrap disables Hub dispatch; set confirm_bootstrap=DISABLE-HUB-DISPATCH" >&2; exit 2; } ;;
            *) echo "invalid release mode" >&2; exit 2 ;;
          esac
          case "$HUB_ONLY" in
            true) caddy_mode=hub-only ;;
            false|"") caddy_mode=full ;;
            *) echo "invalid hub_only value" >&2; exit 2 ;;
          esac
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid deploy commit" >&2; exit 2; }
          test -n "$SSH_TARGET" || { echo "VM SSH target is not configured" >&2; exit 2; }
          ssh -i "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_TARGET" bash -s -- apply "$DEPLOY_SHA" "$RELEASE_MODE" "$caddy_mode" "${cli_mode_args[@]}" \
            < deploy/vm/deploy-release-transaction.sh
      - name: Read Hub API health on the configured client URL
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'active' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --silent --show-error --fail --max-time 15 \
              https://hub.dtcdev.click/health --output "$RUNNER_TEMP/hub-health.json"; then
              if python3 - "$RUNNER_TEMP/hub-health.json" "$RELEASE_MODE" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          mode = sys.argv[2]
          if mode == "bootstrap":
              healthy = payload.get("status") == "bootstrap" and payload.get("dispatch_enabled") is False
          elif mode == "active":
              healthy = payload.get("ok") is True and payload.get("service") == "hub2"
          else:
              raise SystemExit("invalid release mode")
          if not healthy:
              raise SystemExit("Hub API health read did not report the requested healthy release mode")
          print("Hub API health read passed on hub.dtcdev.click")
          PY
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Hub API health read did not report the requested healthy release mode: $RELEASE_MODE" >&2
          exit 1
      - name: Publish matched CLI and host release assets
        if: (inputs.release_mode || 'active') == 'active'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ steps.prepare_cli_bundle.outputs.manifest_sha256 }}
          SSH_TARGET: ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid deploy commit" >&2; exit 2; }
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid manifest digest" >&2; exit 2; }
          ssh -i "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_TARGET" bash -s -- publish "$DEPLOY_SHA" "$MANIFEST_SHA256" \
            < deploy/vm/deploy-release-transaction.sh
      - name: Verify public CLI and host release assets against CI bundle
        if: (inputs.release_mode || 'active') == 'active'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BUNDLE_DIR: ${{ steps.prepare_cli_bundle.outputs.bundle_dir }}
          MANIFEST_SHA256: ${{ steps.prepare_cli_bundle.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          public_dir="$RUNNER_TEMP/public-cli-release/$DEPLOY_SHA"
          rm -rf -- "$public_dir"
          mkdir -m 700 -p "$public_dir"
          python3 - "$BUNDLE_DIR" "$public_dir" "$DEPLOY_SHA" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          bundle = Path(sys.argv[1])
          public_dir = Path(sys.argv[2])
          deploy_sha = sys.argv[3]
          files = sorted(p for p in bundle.iterdir() if p.is_file())
          if not files:
              raise SystemExit("verified bundle is empty")
          for expected_path in files:
              name = expected_path.name
              url = f"https://hub.dtcdev.click/cli/{name}"
              proc = subprocess.run(
                  ["curl", "--silent", "--show-error", "--fail", "--max-time", "20", url],
                  capture_output=True,
              )
              if proc.returncode != 0:
                  raise SystemExit(f"failed to fetch public asset {url}: {proc.stderr.decode('utf-8', 'replace')}")
              expected_bytes = expected_path.read_bytes()
              if proc.stdout != expected_bytes:
                  actual_sha = hashlib.sha256(proc.stdout).hexdigest()
                  expected_sha = hashlib.sha256(expected_bytes).hexdigest()
                  raise SystemExit(
                      f"public asset {name} mismatch: expected sha256={expected_sha} ({len(expected_bytes)}B), "
                      f"got sha256={actual_sha} ({len(proc.stdout)}B)"
                  )
              (public_dir / name).write_bytes(proc.stdout)
          manifest = json.loads((public_dir / "manifest.json").read_text(encoding="utf-8"))
          host_release = json.loads((public_dir / "host-release.json").read_text(encoding="utf-8"))
          if manifest.get("built_from_commit") != deploy_sha or host_release.get("host_version") != deploy_sha:
              raise SystemExit("public release metadata does not match deploy commit")
          print(f"Verified {len(files)} public /cli/ release assets for {deploy_sha}")
          PY
          python3 scripts/build-hub2-release.py \
            --rev "$DEPLOY_SHA" \
            --verify-dir "$public_dir" \
            --manifest-sha256 "$MANIFEST_SHA256"
      - name: Run pre-commit live shell start canary on Hetzner
        id: precommit_shell_canary
        if: (inputs.release_mode || 'active') == 'active'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BUNDLE_DIR: ${{ steps.prepare_cli_bundle.outputs.bundle_dir }}
          CANARY_SSH_KEY: ${{ secrets.AGENT_HUB_CANARY_SSH_KEY }}
          CANARY_SSH_TARGET: ${{ secrets.AGENT_HUB_CANARY_SSH_USER }}@${{ secrets.AGENT_HUB_CANARY_SSH_HOST }}
          CANARY_SSH_KNOWN_HOSTS: ${{ secrets.AGENT_HUB_CANARY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid deploy commit" >&2; exit 2; }
          test -f "$BUNDLE_DIR/hub.pyz" || { echo "verified CLI bundle hub.pyz is missing" >&2; exit 2; }
          test -n "${CANARY_SSH_KEY:-}" || { echo "Hetzner canary SSH key is not configured" >&2; exit 2; }
          [[ "${CANARY_SSH_TARGET:-}" =~ ^[^[:space:]@]+@[^[:space:]@]+$ ]] \
            || { echo "Hetzner canary SSH target is not configured" >&2; exit 2; }
          test -n "${CANARY_SSH_KNOWN_HOSTS:-}" || { echo "Hetzner canary SSH known_hosts is not configured" >&2; exit 2; }
          install -m 700 -d "$RUNNER_TEMP/agent-hub-ssh"
          umask 077
          canary_key="$RUNNER_TEMP/agent-hub-ssh/hetzner_canary_key"
          canary_known_hosts="$RUNNER_TEMP/agent-hub-ssh/hetzner_canary_known_hosts"
          printf '%s\n' "$CANARY_SSH_KEY" > "$canary_key"
          printf '%s\n' "$CANARY_SSH_KNOWN_HOSTS" > "$canary_known_hosts"
          unset CANARY_SSH_KEY CANARY_SSH_KNOWN_HOSTS
          if ! ssh-keygen -y -f "$canary_key" -P '' >/dev/null 2>&1; then
            echo "Hetzner canary SSH key is not a valid unencrypted private key" >&2
            exit 1
          fi
          cli_sha256="$(python3 -I -S - "$BUNDLE_DIR/hub.pyz" <<'PY'
          import hashlib, pathlib, sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          [[ "$cli_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid candidate hub.pyz digest" >&2; exit 2; }
          helper_sha256="$(python3 -I -S scripts/hub_start_canary.py --print-helper-sha256)"
          [[ "$helper_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid canary helper digest" >&2; exit 2; }
          run_token="$(python3 -I -S -c 'import secrets; print(secrets.token_hex(16))')"
          verdict_file="$RUNNER_TEMP/precommit-shell-canary.json"
          ssh -i "$canary_key" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$canary_known_hosts" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$CANARY_SSH_TARGET" \
            "hub-deploy-gate --candidate-sha $DEPLOY_SHA --candidate-cli-sha256 $cli_sha256 --run-token $run_token --helper-sha256 $helper_sha256" \
            > "$verdict_file"
          python3 -I -S - "$verdict_file" "$DEPLOY_SHA" "$run_token" "$helper_sha256" "$cli_sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = [line.strip() for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit(f"expected single-line JSON verdict from pre-commit canary, got {len(lines)} lines")
          verdict = json.loads(lines[0])
          deploy_sha, run_token, helper_sha256, cli_sha256 = sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          if verdict.get("ok") is not True or verdict.get("deploy_gate") is not True:
              raise SystemExit(f"pre-commit shell canary did not pass: {lines[0]}")
          if verdict.get("mode") != "shell" or verdict.get("stage") is not None or verdict.get("reason") is not None:
              raise SystemExit(f"unexpected pre-commit canary mode/stage/reason: {lines[0]}")
          if verdict.get("candidate_sha") != deploy_sha or verdict.get("host_version") != deploy_sha:
              raise SystemExit(f"pre-commit canary candidate/host SHA mismatch: {lines[0]}")
          if verdict.get("run_token") != run_token:
              raise SystemExit(f"pre-commit canary run token mismatch: {lines[0]}")
          if verdict.get("helper_sha256") != helper_sha256:
              raise SystemExit(f"pre-commit canary helper digest mismatch: {lines[0]}")
          if verdict.get("hub_pyz_sha256") != cli_sha256:
              raise SystemExit(f"pre-commit canary hub.pyz digest mismatch: {lines[0]}")
          if verdict.get("intake_archived") is not True or verdict.get("cleanup") != "not_needed":
              raise SystemExit(f"pre-commit canary cleanup/intake archival incomplete: {lines[0]}")
          print(f"Pre-commit live shell canary passed on Hetzner for {deploy_sha} (session {verdict.get('session_id')})")
          PY
      - name: Finalize deploy after all public smokes pass
        id: finalize_deploy
        env:
          SSH_TARGET: ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_TARGET" bash -s -- commit < deploy/vm/deploy-release-transaction.sh
      - name: Provision oncall tokens into a recipient-encrypted artifact
        if: inputs.oncall_recipient_public_key_b64 != ''
        env:
          ONCALL_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.oncall_recipient_public_key_b64 }}
          ONCALL_ROTATE: ${{ inputs.oncall_rotate }}
          SSH_TARGET: ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          set -euo pipefail
          recipient_key="${RUNNER_TEMP}/oncall-recipient.pub"
          envelope="${RUNNER_TEMP}/oncall-token-envelope.b64"
          printf '%s' "$ONCALL_RECIPIENT_PUBLIC_KEY_B64" | base64 --decode > "$recipient_key"
          chmod 600 "$recipient_key"
          rotate_args=()
          if [ "$ONCALL_ROTATE" = true ]; then rotate_args+=(--rotate); fi
          ssh -i "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$SSH_TARGET" "sudo python3 /opt/agent-hub/deploy/vm/provision-oncall-alerts.py ${rotate_args[*]}" \
            < "$recipient_key" > "$envelope"
          base64 --decode "$envelope" >/dev/null
          chmod 600 "$envelope"
      - name: Upload encrypted oncall token artifact
        if: inputs.oncall_recipient_public_key_b64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: oncall-token-envelope-${{ github.run_id }}
          path: ${{ runner.temp }}/oncall-token-envelope.b64
          if-no-files-found: error
          retention-days: 1
      - name: Automatically restore the previous release and Caddy config after a failed deploy or smoke
        if: always() && steps.finalize_deploy.outcome != 'success' && steps.deploy_vm.outcome != 'skipped'
        env:
          SSH_TARGET: ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" || {
            echo "automatic rollback unavailable because the scoped VM key was not installed" >&2
            exit 1
          }
          ssh -i "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_TARGET" bash -s -- rollback < deploy/vm/deploy-release-transaction.sh
      - name: Alert the deploy owner when an automatic deploy fails
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Hub2 auto-deploy failed: main is not live in production"
          body="$(printf 'Automatic production deploy of main %s failed after green CI, so the merged fix is NOT deployed to hub.dtcdev.click or hosts.\n\nDeploy owner: %s (repository owner). Run: %s\n\nNext step: read the failed step; fix forward or rerun with gh workflow run deploy.yml --ref main -f dry_run=false. Close this issue once host-release.json reports a commit that contains %s.' "$DEPLOY_SHA" "$OWNER" "$RUN_URL" "$DEPLOY_SHA")"
          existing="$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            gh issue edit "$existing" --repo "$REPO" --add-assignee "$OWNER"
          else
            gh issue create --repo "$REPO" --title "$title" --assignee "$OWNER" --body "$body"
          fi
          echo "::error title=Hub2 auto-deploy failed::main $DEPLOY_SHA is not deployed; deploy owner $OWNER alerted via issue"
      - name: Remove the temporary SSH key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" "$RUNNER_TEMP/agent-hub-ssh/hetzner_canary_key" "$RUNNER_TEMP/agent-hub-ssh/hetzner_canary_known_hosts" "$RUNNER_TEMP/precommit-shell-canary.json"
  rollback_pending:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.rollback_pending
    concurrency:
      group: agent-hub-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install scoped VM deploy key
        env:
          VM_DEPLOY_KEY: ${{ secrets.AGENT_HUB_VM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/agent-hub-ssh"
          umask 077
          key_file="$RUNNER_TEMP/agent-hub-ssh/hub_vm_key"
          printf '%s\n' "$VM_DEPLOY_KEY" > "$key_file"
          unset VM_DEPLOY_KEY
          if ! ssh-keygen -y -P '' -f "$key_file" >/dev/null 2>&1; then
            echo "VM deploy key is not a valid unencrypted private key" >&2
            exit 1
          fi
      - name: Restore the protected previous release using the fixed script
        env:
          SSH_TARGET: ${{ secrets.AGENT_HUB_VM_USER }}@${{ secrets.AGENT_HUB_VM_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_TARGET" bash -s -- rollback < deploy/vm/deploy-release-transaction.sh
      - name: Remove the temporary SSH key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/agent-hub-ssh/hub_vm_key"
