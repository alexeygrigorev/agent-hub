name: Canonical host distribution
on:
  pull_request:
    paths: ['hub2/host/**', 'deploy/host-install.ps1', 'pyproject.toml', 'uv.lock', 'scripts/ci/test_root_distribution.py', '.github/workflows/host-canary.yml']
  push:
    branches: [main]
    paths: ['hub2/host/**', 'deploy/host-install.ps1', 'pyproject.toml', 'uv.lock', 'scripts/ci/test_root_distribution.py', '.github/workflows/host-canary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted", "contabo"]') || matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
      - run: python scripts/ci/test_root_distribution.py
      # Intake 41ef7048: the Windows host installer/updater must parse under
      # Windows PowerShell 5.1, and the host lifecycle helpers must pass on Windows.
      # Intake 56a34448: `hub host self-update` is exercised inside a real
      # per-user scheduled task; -rA keeps its Task Scheduler evidence in the log.
      - name: Parse Windows host installer (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'deploy\host-install.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.ToString() }; exit 1 }
          Write-Host 'host-install.ps1 parses'
      - name: Windows host lifecycle tests
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: hub2/host;hub2/host/tests
        run: |
          python -m pip install pytest "websockets==16.0"
          python -m pytest -q -p no:cacheprovider -rA hub2/host/tests/test_windows_host.py hub2/host/tests/test_windows_self_update_task.py
