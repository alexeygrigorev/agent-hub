name: Canonical host distribution
on:
  pull_request:
    paths: ['hub2/host/**', 'pyproject.toml', 'uv.lock', 'scripts/ci/test_root_distribution.py', '.github/workflows/host-canary.yml']
  push:
    branches: [main]
    paths: ['hub2/host/**', 'pyproject.toml', 'uv.lock', 'scripts/ci/test_root_distribution.py', '.github/workflows/host-canary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
      - run: python scripts/ci/test_root_distribution.py
