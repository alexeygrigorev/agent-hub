name: Hub2 Cloudflare billing backstop

on:
  workflow_dispatch:
    inputs:
      apply_backstop:
        description: Add missing $0.50 current-period notification policies for Workers and Durable Objects
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  billing-backstop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit existing Cloudflare billing policies and recipients
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPLY_BACKSTOP: ${{ inputs.apply_backstop }}
        run: |
          if [ "$APPLY_BACKSTOP" = "true" ]; then
            python3 hub2/scripts/cloudflare-billing-policy.py --apply
          else
            python3 hub2/scripts/cloudflare-billing-policy.py
          fi

      - name: Record scope and delivery limitations
        run: |
          {
            echo "### Cloudflare Hub2 billing backstop"
            echo
            echo "This checks account-level Workers and Durable Objects notification policies for the current billing period. It is separate from the Hub-specific USD 0.03 UTC-day monitor."
            echo
            echo "Only notification policies are created; existing policies are never edited or deleted. The Spend Policies API has no safe delivery-test operation, so a successful run proves API configuration read-back, not email delivery."
          } >> "$GITHUB_STEP_SUMMARY"
