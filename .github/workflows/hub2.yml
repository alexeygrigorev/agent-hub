name: Hub 2.0 checks

on:
  push:
    paths:
      - "hub2/**"
      - "docs/hub2/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hub2.yml"
      - "AGENTS.md"
  pull_request:
    paths:
      - "hub2/**"
      - "docs/hub2/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hub2.yml"
      - "AGENTS.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hub2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup_node
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked toolchain
        id: install
        continue-on-error: true
        run: npm ci

      - name: Typecheck Hub 2.0 source and Node runtime
        id: typecheck
        continue-on-error: true
        run: |
          npm run typecheck
          npm run typecheck --prefix hub2

      - name: Report product SLOC and enforce runtime completeness
        id: budget
        continue-on-error: true
        run: npm run budget --prefix hub2 -- --limit 6000 --accepted-baseline 8962 --report-only-size

      - name: Accounts and mail semantic tests
        id: accounts_semantic
        continue-on-error: true
        run: npm run test:accounts-mail --prefix hub2

      - name: Account provider response timeout tests
        id: account_provider_timeout
        continue-on-error: true
        run: npm run test:account-provider-timeout --prefix hub2

      - name: Project work semantic tests
        id: project_work
        continue-on-error: true
        run: npm run test:project-work --prefix hub2

      - name: Project intake semantic tests
        id: project_intake
        continue-on-error: true
        run: npm run test:project-intake --prefix hub2

      - name: Read cache semantic tests
        id: read_cache
        continue-on-error: true
        run: npm run test:read-cache --prefix hub2

      - name: Database metering semantic tests
        id: db_metering
        continue-on-error: true
        run: npm run test:db-metering --prefix hub2

      - name: Control grants and directory semantic tests
        id: control
        continue-on-error: true
        run: npm run test:control --prefix hub2

      - name: Resource Manager admission and routing tests
        id: resource_manager
        continue-on-error: true
        run: npm run test:resource-manager --prefix hub2

      - name: Mail retention and restart e2e on Node runtime
        id: accounts_mail_node
        continue-on-error: true
        run: npm run test:accounts-mail-node --prefix hub2

      - name: OIDC auth flows e2e on Node runtime
        id: auth_flows
        continue-on-error: true
        run: npm run test:normal-day-auth --prefix hub2

      - name: Auth cleanup bounded-restart tests on Node runtime
        id: auth_gc
        continue-on-error: true
        run: npm run test:auth-gc --prefix hub2

      - name: Machine websocket capacity e2e on Node runtime
        id: machine_socket_cap
        continue-on-error: true
        run: npm run test:machine-socket-cap --prefix hub2

      - name: Public worker core e2e on Node runtime
        id: core_node
        continue-on-error: true
        run: npm run test:core --prefix hub2

      - name: Public worker and native mail roundtrip
        id: public_mail
        continue-on-error: true
        env:
          HUB2_CORE_PUBLIC_MAIL: "1"
        run: npm run test:core --prefix hub2

      - name: Clean-start production entry on Node runtime
        id: production_clean_start
        continue-on-error: true
        run: npm run test:production-clean-start --prefix hub2

      - name: Durable oncall alert ingest on Node runtime
        id: oncall_alerts
        continue-on-error: true
        run: npm run test:oncall-alerts --prefix hub2

      - name: Fail the job if any gate failed
        if: always()
        env:
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUDGET: ${{ steps.budget.outcome }}
          ACCOUNTS_SEMANTIC: ${{ steps.accounts_semantic.outcome }}
          ACCOUNT_PROVIDER_TIMEOUT: ${{ steps.account_provider_timeout.outcome }}
          PROJECT_WORK: ${{ steps.project_work.outcome }}
          PROJECT_INTAKE: ${{ steps.project_intake.outcome }}
          READ_CACHE: ${{ steps.read_cache.outcome }}
          DB_METERING: ${{ steps.db_metering.outcome }}
          CONTROL: ${{ steps.control.outcome }}
          RESOURCE_MANAGER: ${{ steps.resource_manager.outcome }}
          ACCOUNTS_MAIL_NODE: ${{ steps.accounts_mail_node.outcome }}
          AUTH_FLOWS: ${{ steps.auth_flows.outcome }}
          AUTH_GC: ${{ steps.auth_gc.outcome }}
          MACHINE_SOCKET_CAP: ${{ steps.machine_socket_cap.outcome }}
          CORE_NODE: ${{ steps.core_node.outcome }}
          PUBLIC_MAIL: ${{ steps.public_mail.outcome }}
          PRODUCTION_CLEAN_START: ${{ steps.production_clean_start.outcome }}
          ONCALL_ALERTS: ${{ steps.oncall_alerts.outcome }}
        run: |
          failed=0
          for result in \
            "setup_node:$SETUP_NODE" "install:$INSTALL" "typecheck:$TYPECHECK" \
            "budget:$BUDGET" "accounts_semantic:$ACCOUNTS_SEMANTIC" \
            "account_provider_timeout:$ACCOUNT_PROVIDER_TIMEOUT" \
            "project_work:$PROJECT_WORK" "project_intake:$PROJECT_INTAKE" \
            "read_cache:$READ_CACHE" "db_metering:$DB_METERING" \
            "control:$CONTROL" "resource_manager:$RESOURCE_MANAGER" \
            "accounts_mail_node:$ACCOUNTS_MAIL_NODE" "auth_flows:$AUTH_FLOWS" \
            "auth_gc:$AUTH_GC" "machine_socket_cap:$MACHINE_SOCKET_CAP" \
            "core_node:$CORE_NODE" "public_mail:$PUBLIC_MAIL" \
            "production_clean_start:$PRODUCTION_CLEAN_START" \
            "oncall_alerts:$ONCALL_ALERTS"; do
            name=${result%%:*}
            outcome=${result#*:}
            echo "$name: $outcome"
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              failed=1
            fi
          done
          exit $failed
