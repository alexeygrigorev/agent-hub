name: Hub 2.0 checks

on:
  push:
    paths:
      - "hub2/**"
      - "docs/hub2/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hub2.yml"
      - ".github/workflows/hub2-billing-audit.yml"
      - "AGENTS.md"
  pull_request:
    paths:
      - "hub2/**"
      - "docs/hub2/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hub2.yml"
      - ".github/workflows/hub2-billing-audit.yml"
      - "AGENTS.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hub2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup_node
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked root toolchain
        id: install
        continue-on-error: true
        run: npm ci

      - name: Typecheck Hub 2.0 source
        id: typecheck
        continue-on-error: true
        run: npm run typecheck --prefix hub2

      - name: Enforce approved 8,962-SLOC release ceiling and report totals
        id: budget
        continue-on-error: true
        run: npm run budget --prefix hub2 -- --limit 6000 --accepted-baseline 8962

      - name: Accounts and mail semantic tests
        id: accounts_semantic
        continue-on-error: true
        run: npm run test:accounts-mail --prefix hub2

      - name: Account provider response timeout tests
        id: account_provider_timeout
        continue-on-error: true
        run: npm run test:account-provider-timeout --prefix hub2

      - name: Project work semantic tests
        id: project_work
        continue-on-error: true
        run: npm run test:project-work --prefix hub2

      - name: Project intake semantic tests
        id: project_intake
        continue-on-error: true
        run: npm run test:project-intake --prefix hub2

      - name: Read cache semantic tests
        id: read_cache
        continue-on-error: true
        run: npm run test:read-cache --prefix hub2

      - name: Database metering semantic tests
        id: db_metering
        continue-on-error: true
        run: npm run test:db-metering --prefix hub2

      - name: Control grants and directory semantic tests
        id: control
        continue-on-error: true
        run: npm run test:control --prefix hub2

      - name: Control alarm budget retry tests
        id: control_budget_alarm
        continue-on-error: true
        run: npm run test:control-budget-alarm --prefix hub2

      - name: Resource Manager admission and routing tests
        id: resource_manager
        continue-on-error: true
        run: npm run test:resource-manager --prefix hub2

      - name: Cloudflare backstop policy safety tests
        id: billing_policy
        continue-on-error: true
        run: npm run test:billing-policy --prefix hub2

      - name: Durable cost ledger, ceilings, alerts, and restart tests
        id: budget_controller
        continue-on-error: true
        run: npm run test:budget --prefix hub2

      - name: Public budget enforcement and alert delivery restart
        id: budget_edge
        continue-on-error: true
        run: npm run test:budget-edge --prefix hub2

      - name: Accounts and mail Workerd tests
        id: accounts_workerd
        continue-on-error: true
        run: npm run test:accounts-mail-workerd --prefix hub2

      - name: Auth and enrollment Workerd tests
        id: auth_workerd
        continue-on-error: true
        run: npm run test:normal-day-auth --prefix hub2

      - name: Auth cleanup metering and restart tests
        id: auth_gc
        continue-on-error: true
        run: npm run test:auth-gc --prefix hub2

      - name: Machine WebSocket singleton Workerd tests
        id: machine_socket_cap
        continue-on-error: true
        run: npm run test:machine-socket-cap --prefix hub2

      - name: Normal day Workerd budget and idle tests
        id: normal_day
        continue-on-error: true
        run: npm run test:normal-day --prefix hub2

      - name: Public Worker core Workerd tests
        id: core_workerd
        continue-on-error: true
        run: npm run test:core-workerd --prefix hub2

      - name: Public Worker and native mail roundtrip
        id: public_mail
        continue-on-error: true
        env:
          HUB2_CORE_PUBLIC_MAIL: "1"
        run: npm run test:core-workerd --prefix hub2

      - name: Build the local-only Wrangler bundle
        id: bundle
        continue-on-error: true
        run: npm run bundle:dry-run --prefix hub2

      - name: Validate clean-start production manifest and bundle
        id: production_clean_start
        continue-on-error: true
        run: |
          node hub2/tests/production-clean-start.test.mjs
          cd hub2
          npx wrangler deploy --dry-run --config wrangler.production.jsonc --outdir .local/hub2-production-dist

      - name: Fail the job if any gate failed
        if: always()
        env:
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUDGET: ${{ steps.budget.outcome }}
          ACCOUNTS_SEMANTIC: ${{ steps.accounts_semantic.outcome }}
          ACCOUNT_PROVIDER_TIMEOUT: ${{ steps.account_provider_timeout.outcome }}
          PROJECT_WORK: ${{ steps.project_work.outcome }}
          PROJECT_INTAKE: ${{ steps.project_intake.outcome }}
          READ_CACHE: ${{ steps.read_cache.outcome }}
          DB_METERING: ${{ steps.db_metering.outcome }}
          CONTROL: ${{ steps.control.outcome }}
          CONTROL_BUDGET_ALARM: ${{ steps.control_budget_alarm.outcome }}
          RESOURCE_MANAGER: ${{ steps.resource_manager.outcome }}
          BILLING_POLICY: ${{ steps.billing_policy.outcome }}
          BUDGET_CONTROLLER: ${{ steps.budget_controller.outcome }}
          BUDGET_EDGE: ${{ steps.budget_edge.outcome }}
          ACCOUNTS_WORKERD: ${{ steps.accounts_workerd.outcome }}
          AUTH_WORKERD: ${{ steps.auth_workerd.outcome }}
          AUTH_GC: ${{ steps.auth_gc.outcome }}
          MACHINE_SOCKET_CAP: ${{ steps.machine_socket_cap.outcome }}
          NORMAL_DAY: ${{ steps.normal_day.outcome }}
          CORE_WORKERD: ${{ steps.core_workerd.outcome }}
          PUBLIC_MAIL: ${{ steps.public_mail.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
          PRODUCTION_CLEAN_START: ${{ steps.production_clean_start.outcome }}
        run: |
          failed=0
          for result in \
            "setup_node:$SETUP_NODE" "install:$INSTALL" "typecheck:$TYPECHECK" \
            "budget:$BUDGET" "accounts_semantic:$ACCOUNTS_SEMANTIC" \
            "account_provider_timeout:$ACCOUNT_PROVIDER_TIMEOUT" \
            "project_work:$PROJECT_WORK" "project_intake:$PROJECT_INTAKE" \
            "read_cache:$READ_CACHE" "db_metering:$DB_METERING" \
            "control:$CONTROL" "control_budget_alarm:$CONTROL_BUDGET_ALARM" \
            "resource_manager:$RESOURCE_MANAGER" "billing_policy:$BILLING_POLICY" \
            "budget_controller:$BUDGET_CONTROLLER" "budget_edge:$BUDGET_EDGE" \
            "accounts_workerd:$ACCOUNTS_WORKERD" \
            "auth_workerd:$AUTH_WORKERD" "auth_gc:$AUTH_GC" \
            "machine_socket_cap:$MACHINE_SOCKET_CAP" \
            "normal_day:$NORMAL_DAY" \
            "core_workerd:$CORE_WORKERD" "public_mail:$PUBLIC_MAIL" "bundle:$BUNDLE" \
            "production_clean_start:$PRODUCTION_CLEAN_START"; do
            name=${result%%:*}
            outcome=${result#*:}
            if [ "$outcome" != success ]; then
              echo "::error::Hub 2.0 gate $name ended with $outcome"
              failed=1
            else
              echo "Hub 2.0 gate $name passed"
            fi
          done
          exit "$failed"

  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the exact Hub 2 host dependency
        run: python -m pip install -e ./hub2/host
      - name: Run Hub 2 host tests
        run: python hub2/scripts/test_host.py
