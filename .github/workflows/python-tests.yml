name: Python host tests

# Plan item 1.2: the Python host and CLI tests used to run nowhere in CI.
# No path filter on purpose, so the jobs are always reported and can be required.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub2-host-python:
    name: hub2-host-python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "websockets==16.0"
      - name: hub2/host tests (disposable HOME)
        run: |
          scripts/ci/run-python-tests.sh hub2/host/tests/QUARANTINE.md \
            "$PWD/hub2/host:$PWD/hub2/host/tests" -- hub2/host/tests

  legacy-cli-python:
    name: legacy-cli-python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "websockets==16.0"
      - name: legacy host CLI tests (disposable HOME)
        run: |
          scripts/ci/run-python-tests.sh host/tests/QUARANTINE-cli.md \
            "$PWD/host:$PWD/host/tests" -- \
            host/tests/test_cli*.py host/tests/test_session_control.py host/tests/test_intake*.py host/tests/test_native_claude_import.py host/tests/test_stage_credential_monitor.py \
            host/tests/test_credentials.py::test_scoped_authoritative_generation_replaces_old_rotation_without_writeback \
            host/tests/test_credentials.py::test_scoped_materialization_refuses_conflicts_without_mutation \
            host/tests/test_credentials.py::test_scoped_materialization_state_publication_failure_is_resumable \
            host/tests/test_credentials.py::test_scoped_materialization_missing_first_state_and_file_repair \
            host/tests/test_credentials.py::test_scoped_materialization_existing_scalar_state_never_means_missing \
            host/tests/test_provisioning.py::test_scoped_install_refuses_newer_state_before_hooks_or_package_writes \
            host/tests/test_provisioning.py::test_scoped_install_scalar_state_refuses_before_package_and_hooks
