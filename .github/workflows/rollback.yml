name: Hub2 source rollback validation
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed Hub2 source to rebuild; never restore Hub1 over the fresh database
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/release-contract.test.mjs
      - run: npm run typecheck
      - run: npm run build  # typecheck + Node clean-start boot, no Cloudflare toolchain
      - name: Activation contract
        run: echo 'Validation only. Integrate reviewed Hub2 source on main, pass full Hub2 CI, then use production workflow. No legacy version restore or storage reset.'
