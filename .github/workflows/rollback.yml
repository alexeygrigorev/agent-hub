name: Hub2 source rollback validation
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed Hub2 source to rebuild; never restore Hub1 over the fresh database
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Rollback compatibility must agree with the forward deploy lane on
      # Node24: the previous reviewed source (and its native dependencies)
      # rebuild and start on the same runtime CI provisions on the VM.
      - run: |
          node --version | grep -Eq '^v24\.' \
            || { echo "::error::rollback validation must run on Node24; setup-node drifted" >&2; exit 1; }
          npm --version
      - run: npm ci
      - run: node --test test/release-contract.test.mjs
      - run: npm run typecheck
      - run: npm run build  # typecheck + Node clean-start boot, no Cloudflare toolchain
      - name: Activation contract
        run: echo 'Validation only. Integrate reviewed Hub2 source on main, pass full Hub2 CI, then use production workflow. No legacy version restore or storage reset.'
