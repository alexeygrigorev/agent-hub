name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Exact Cloudflare Worker Version ID to restore at 100% (e.g. cf8aef89-43de-4732-a2aa-e34ce91a426d)"
        required: true
        type: string
      release_slot:
        description: "Orchestrator release slot id issued for this version (hub releases issue --target <version_id>)"
        required: true
        type: string
      message:
        description: "Reason / message for rollback deployment annotation"
        required: false
        default: "Manual rollback via GitHub Actions"
        type: string

permissions:
  contents: read

jobs:
  rollback:
    concurrency:
      group: agent-hub-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same orchestrator release slot gate as the deploy workflow (intake
      # 2c87c231 AC2): a rollback is a manual deploy, so dispatching it also
      # consumes a single-use slot bound to the exact version id.
      - name: Release slot gate (orchestrator-issued, single-use, version-bound)
        env:
          INPUT_RELEASE_SLOT: ${{ github.event.inputs.release_slot }}
          INPUT_VERSION_ID: ${{ github.event.inputs.version_id }}
        run: python3 scripts/ci/release_slot_verify.py --target "$INPUT_VERSION_ID" --slot "$INPUT_RELEASE_SLOT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Version at 100%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERSION="${{ github.event.inputs.version_id }}"
          MSG="${{ github.event.inputs.message }}"
          echo "Rolling back agent-hub to version $VERSION at 100%..."
          npx wrangler versions deploy "$VERSION@100%" --message "$MSG" --yes
          echo "Active versions following rollback:"
          npx wrangler versions list
