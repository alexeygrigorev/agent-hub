name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Shared device login (DataTalksClub/auth)
        uses: actions/checkout@v4
        with:
          repository: DataTalksClub/auth
          path: .deps/auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m pip install pytest
      - name: Host client tests
        working-directory: host
        env:
          DTC_AUTH_HOME: ${{ github.workspace }}/.deps/auth
        run: python -m pytest -q
      - name: Script tests
        run: python -m pytest -q test/test_registry_import.py test/test_scripts.py
