[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_hub_host"
version = "2.0.0"
description = "Agent Hub 2 native host and CLI"
requires-python = ">=3.11"
dependencies = ["websockets==16.0"]

[project.scripts]
hub = "hub2_agent_hub_host.cli:main"
hub2 = "hub2_agent_hub_host.cli:main"

[tool.setuptools]
package-dir = {"" = "hub2/host"}
packages = ["hub2_agent_hub_host"]
