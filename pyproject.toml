[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_hub_host"
version = "0.2.0"
description = "Agent Hub Host"
requires-python = ">=3.11"
dependencies = [
    "aplexer-client==0.1.19",
]

[project.scripts]
hub = "agent_hub_host.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.setuptools]
package-dir = {"" = "host"}
packages = ["agent_hub_host"]
